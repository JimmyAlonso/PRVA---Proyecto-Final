spring.application.name=sga

# --- Base de datos H2 en memoria (la persistencia JPA llega en la Guía 09; hoy los
#     repositorios son adaptadores en memoria y se reemplazan sin tocar el dominio) ---
spring.datasource.url=jdbc:h2:mem:sgadb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# --- Consola web de H2 ---
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# --- JPA ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# --- Servidor ---
server.port=8080

# 3.1: todas las fechas en la zona horaria de Colombia
spring.jackson.time-zone=America/Bogota
# Fechas y horas en formato ISO en parámetros de URL (AAAA-MM-DD, HH:mm)
spring.mvc.format.date=iso
spring.mvc.format.time=HH:mm
spring.mvc.format.date-time=iso

# =====================================================================================
#  Ficha del Alojamiento (Anexo A) - JiyJu Glamping. Sección 6: esto es configuración,
#  nunca constantes en el código. Cambiar un valor NO requiere recompilar.
# =====================================================================================
sga.alojamiento.nombre=JiyJu Glamping
sga.alojamiento.descripcion=Alojamiento tur\u00edstico tipo eco-glamping de monta\u00f1a compuesto por domos individuales, enfocado en el descanso, la naturaleza y la experiencia.
sga.alojamiento.ciudad=Salento, Quind\u00edo
sga.alojamiento.direccion=Vereda Palestina, Salento, Quind\u00edo
sga.alojamiento.latitud=4.6378
sga.alojamiento.longitud=-75.5703
sga.alojamiento.normas-convivencia=Silencio desde las 10:00 pm. No se permiten mascotas. Prohibido fumar dentro de los domos. Fogatas solo en la zona asignada.

# L-12 horas de entrada y salida
sga.alojamiento.hora-entrada=15:00
sga.alojamiento.hora-salida=11:00
# L-09 umbral de edad facturable (años)
sga.alojamiento.umbral-edad-facturable=12
# L-13 tiempo de preparación entre estancias (horas)
sga.alojamiento.tiempo-preparacion-horas=4
# L-14 plazo de confirmación de una reserva pendiente (horas)
sga.alojamiento.plazo-confirmacion-horas=4
# L-15 hora límite para declarar no-show
sga.alojamiento.hora-limite-no-show=20:00
# L-11 anticipo exigido para confirmar (% del valor de la reserva; 0 = no se exige)
sga.alojamiento.anticipo-porcentaje=50
# L-22 depósito de garantía (COP). La ficha no fija el valor: confirmarlo con el equipo.
sga.alojamiento.deposito=100000
# L-20 recargo por persona adicional: ocupación base y % sobre la tarifa por ocupante adicional
sga.alojamiento.recargo-ocupantes-incluidos=2
sga.alojamiento.recargo-porcentaje=25
# L-21 horas de precalentamiento del jacuzzi
sga.alojamiento.jacuzzi-horas-precalentamiento=3
# L-16 mascotas
sga.alojamiento.acepta-mascotas=false

# L-17 servicios adicionales (Ficha A.5)
sga.alojamiento.servicios[0].codigo=KIT_FOGATA
sga.alojamiento.servicios[0].nombre=Kit de fogata adicional (paquete extra de le\u00f1a)
sga.alojamiento.servicios[0].valor=30000
sga.alojamiento.servicios[0].por-persona=false
sga.alojamiento.servicios[1].codigo=DECORACION_ROMANTICA
sga.alojamiento.servicios[1].nombre=Decoraci\u00f3n rom\u00e1ntica / aniversario (montaje, luces y vino)
sga.alojamiento.servicios[1].valor=80000
sga.alojamiento.servicios[1].por-persona=false
sga.alojamiento.servicios[2].codigo=CENA_DOMO
sga.alojamiento.servicios[2].nombre=Cena en el domo (men\u00fa artesanal en la terraza)
sga.alojamiento.servicios[2].valor=60000
sga.alojamiento.servicios[2].por-persona=true

# 7.8 canales externos y su credencial. I-06: en despliegue se inyectan por variable de
# entorno; el valor por defecto solo sirve para desarrollo local y el simulador.
sga.canales.credenciales[BOOKING_COM]=${SGA_CANAL_BOOKING_CLAVE:clave-local-booking}

# RN-21: cada cuánto se revisan las reservas pendientes vencidas (milisegundos)
sga.vencimiento.intervalo-ms=60000

# 12.3: datos de prueba al iniciar
sga.datos-prueba.habilitados=true
