# =====================================================================================
#  Perfil de producción (Guía 22, 4.5). Se activa con SPRING_PROFILES_ACTIVE=prod (Render).
#  Solo contiene lo que CAMBIA en producción; lo demás se hereda de application.properties.
# =====================================================================================

# --- Herramientas de desarrollo apagadas en internet ---
spring.h2.console.enabled=false
springdoc.api-docs.enabled=false
springdoc.swagger-ui.enabled=false
spring.jpa.show-sql=false
sga.seguridad.herramientas-desarrollo=false

# --- Secreto del JWT: OBLIGATORIO en producción. Sin SGA_JWT_SECRETO la aplicación no arranca.
#     Generarlo con: openssl rand -hex 32 ---
sga.seguridad.jwt.secreto=${SGA_JWT_SECRETO}

# --- CORS: URL exacta del frontend en Vercel (sin / final). Varias se separan por coma. ---
sga.cors.allowed-origins=${SGA_CORS_ALLOWED_ORIGINS:}

# --- Credencial del canal externo: en producción no se usa la clave local de desarrollo ---
sga.canales.credenciales[BOOKING_COM]=${SGA_CANAL_BOOKING_CLAVE:}

# --- Datos: solo el catálogo de la Ficha A (domos, temporadas y política), sin usuarios
#     de demostración ni reservas de ejemplo ---
sga.datos-prueba.habilitados=true
sga.datos-prueba.demo=false

# --- Cuenta inicial: solo un administrador, con datos que NO están en el repositorio.
#     Debe quedar habilitada en el plan gratuito: la base se borra cada vez que el servicio
#     se duerme y el administrador se recrea en cada arranque. ---
sga.usuarios-iniciales.habilitados=${SGA_USUARIOS_INICIALES_HABILITADOS:true}
sga.usuarios-iniciales.administrador.nombre=${SGA_ADMIN_NOMBRE:Administrador JiyJu}
sga.usuarios-iniciales.administrador.correo=${SGA_ADMIN_CORREO:}
sga.usuarios-iniciales.administrador.contrasena=${SGA_ADMIN_CONTRASENA:}
sga.usuarios-iniciales.administrador.telefono=${SGA_ADMIN_TELEFONO:}
sga.usuarios-iniciales.administrador.documento=${SGA_ADMIN_DOCUMENTO:}
sga.usuarios-iniciales.administrador.fecha-nacimiento=${SGA_ADMIN_FECHA_NACIMIENTO:}
