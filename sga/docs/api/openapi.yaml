openapi: 3.1.0
info:
  title: SGA - JiyJu Glamping API
  description: >
    API del Sistema de Gestión de Alojamiento (SGA) aplicado a JiyJu Glamping (Salento, Quindío),
    alojamiento de domos. Cubre cotización, disponibilidad, reservas y su ciclo de vida, folio,
    operación diaria de los domos y el canal externo. Los valores monetarios van en COP sin decimales.
    Los errores siguen el esquema ErrorRespuesta: 400 datos mal formados, 404 no encontrado,
    422 regla de negocio violada, 409 conflicto de canal, 401 canal no autorizado.
  version: 1.1.0
servers:
  - url: http://localhost:8080/api/v1
    description: Servidor local de desarrollo

tags:
  - name: Alojamiento
  - name: Domos
  - name: Reservas
  - name: Folio
  - name: Canal externo

paths:
  /alojamiento:
    get:
      tags: [Alojamiento]
      summary: Datos del alojamiento, horarios, normas, servicios y parámetros (7.3)
      operationId: consultarAlojamiento
      responses:
        '200': { description: Datos del alojamiento }

  /domos:
    get:
      tags: [Domos]
      summary: Listar domos activos (paginado de 10)
      operationId: listarDomos
      parameters:
        - $ref: '#/components/parameters/Pagina'
      responses:
        '200': { description: Página de domos }

  /domos/{idDomo}:
    get:
      tags: [Domos]
      summary: Detalle de un domo con su dotación, estado operativo y tarifas
      operationId: obtenerDomo
      parameters:
        - $ref: '#/components/parameters/IdDomo'
      responses:
        '200':
          description: Domo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DomoResponse' }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /domos/disponibles:
    get:
      tags: [Domos]
      summary: Buscar domos disponibles y cotizarlos (7.5)
      description: >
        Aplica RN-01, RN-02, RN-07 y RN-20 y cotiza cada resultado con RN-05, RN-06 y el recargo
        por ocupante adicional (L-20). El grupo se describe con las fechas de nacimiento
        (fechasNacimiento) o, si no se conocen, con numeroOcupantes (se asumen adultos).
      operationId: buscarDomosDisponibles
      parameters:
        - { name: fechaEntrada, in: query, required: true, schema: { type: string, format: date }, example: "2026-11-20" }
        - { name: fechaSalida, in: query, required: true, schema: { type: string, format: date }, example: "2026-11-22" }
        - { name: fechasNacimiento, in: query, required: false, schema: { type: string }, example: "1995-05-15,1996-02-10,2017-03-02" }
        - { name: numeroOcupantes, in: query, required: false, schema: { type: integer, minimum: 1 } }
        - { name: capacidadMinima, in: query, required: false, schema: { type: integer } }
        - { name: precioMaximo, in: query, required: false, schema: { type: integer } }
        - { name: caracteristica, in: query, required: false, schema: { type: string }, example: "Malla" }
        - { name: conJacuzzi, in: query, required: false, schema: { type: boolean } }
        - $ref: '#/components/parameters/Pagina'
      responses:
        '200':
          description: Página de domos disponibles con su cotización
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PaginaCotizaciones' }
        '422': { $ref: '#/components/responses/ReglaDominio' }

  /domos/{idDomo}/cotizacion:
    post:
      tags: [Domos]
      summary: Cotizar una estancia con desglose noche por noche (7.4)
      operationId: cotizarEstancia
      parameters:
        - $ref: '#/components/parameters/IdDomo'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CotizarEstanciaRequest' }
      responses:
        '200':
          description: Cotización
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CotizacionDomoResponse' }
        '422': { $ref: '#/components/responses/ReglaDominio' }

  /domos/pendientes-preparacion:
    get:
      tags: [Domos]
      summary: Domos pendientes o en preparación (personal de servicio)
      operationId: domosPendientesPreparacion
      responses:
        '200': { description: Lista de domos }

  /domos/{idDomo}/estado-operativo:
    post:
      tags: [Domos]
      summary: Cambiar el estado operativo (7.6)
      description: INICIAR_PREPARACION, MARCAR_PREPARADO o DECLARAR_FUERA_DE_SERVICIO (no desde OCUPADO).
      operationId: cambiarEstadoOperativo
      parameters:
        - $ref: '#/components/parameters/IdDomo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [accion]
              properties:
                accion: { type: string, enum: [INICIAR_PREPARACION, MARCAR_PREPARADO, DECLARAR_FUERA_DE_SERVICIO] }
      responses:
        '200': { description: Domo actualizado }
        '422': { $ref: '#/components/responses/ReglaDominio' }

  /domos/{idDomo}/novedades:
    post:
      tags: [Domos]
      summary: Registrar una novedad (daño, faltante o situación)
      operationId: registrarNovedad
      parameters:
        - $ref: '#/components/parameters/IdDomo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [tipo, descripcion, gravedad, autor]
              properties:
                tipo: { type: string, enum: [DANO, FALTANTE, SITUACION] }
                descripcion: { type: string }
                gravedad: { type: string, enum: [LEVE, MODERADA, GRAVE] }
                autor: { type: string }
      responses:
        '201': { description: Novedad registrada }
    get:
      tags: [Domos]
      summary: Historial de novedades del domo (paginado)
      operationId: historialNovedades
      parameters:
        - $ref: '#/components/parameters/IdDomo'
        - $ref: '#/components/parameters/Pagina'
      responses:
        '200': { description: Página de novedades }

  /domos/{idDomo}/bloqueos:
    post:
      tags: [Domos]
      summary: Registrar un bloqueo (no se permite sobre noches con reservas activas)
      operationId: registrarBloqueo
      parameters:
        - $ref: '#/components/parameters/IdDomo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [desde, hasta, motivo]
              properties:
                desde: { type: string, format: date }
                hasta: { type: string, format: date }
                motivo: { type: string, enum: [MANTENIMIENTO, USO_INTERNO, FUERA_DE_SERVICIO] }
                observacion: { type: string }
      responses:
        '201': { description: Bloqueo registrado }
        '422': { $ref: '#/components/responses/ReglaDominio' }
    get:
      tags: [Domos]
      summary: Bloqueos del domo
      operationId: listarBloqueos
      parameters:
        - $ref: '#/components/parameters/IdDomo'
      responses:
        '200': { description: Lista de bloqueos }

  /reservas:
    post:
      tags: [Reservas]
      summary: Crear una reserva (canal PORTAL o DIRECTO)
      description: >
        Valida en orden 7.5: RN-03, RN-04, domo activo con tarifas completas, RN-02, RN-01/RN-07
        y RN-20. Congela valor y política (RN-22), abre el folio y notifica al titular. Nace PENDIENTE.
      operationId: crearReserva
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CrearReservaRequest' }
      responses:
        '201':
          description: Reserva creada en estado PENDIENTE
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservaDetalleResponse' }
        '400': { $ref: '#/components/responses/DatosInvalidos' }
        '422': { $ref: '#/components/responses/ReglaDominio' }
    get:
      tags: [Reservas]
      summary: Listar reservas con filtros (más reciente primero, 10 por página)
      operationId: listarReservas
      parameters:
        - { name: estado, in: query, schema: { type: string, enum: [PENDIENTE, CONFIRMADA, EN_CURSO, FINALIZADA, CANCELADA, NO_SHOW] } }
        - { name: idDomo, in: query, schema: { type: string } }
        - { name: canal, in: query, schema: { type: string, enum: [PORTAL, DIRECTO, EXTERNO] } }
        - { name: documentoTitular, in: query, schema: { type: string } }
        - { name: desde, in: query, schema: { type: string, format: date } }
        - { name: hasta, in: query, schema: { type: string, format: date } }
        - $ref: '#/components/parameters/Pagina'
      responses:
        '200': { description: Página de reservas (ReservaResumenResponse) }

  /reservas/movimientos:
    get:
      tags: [Reservas]
      summary: Llegadas y salidas previstas para un día (7.6)
      operationId: movimientosDelDia
      parameters:
        - { name: fecha, in: query, required: false, schema: { type: string, format: date } }
      responses:
        '200': { description: Llegadas y salidas }

  /reservas/{codigo}:
    get:
      tags: [Reservas]
      summary: Detalle de una reserva
      operationId: obtenerReserva
      parameters:
        - $ref: '#/components/parameters/Codigo'
      responses:
        '200':
          description: Reserva
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReservaDetalleResponse' }
        '404': { $ref: '#/components/responses/NoEncontrado' }
    put:
      tags: [Reservas]
      summary: Modificar fechas, ocupantes o domo (RN-14)
      description: Solo en PENDIENTE o CONFIRMADA. Recalcula con tarifas vigentes y registra el ajuste en el folio.
      operationId: modificarReserva
      parameters:
        - $ref: '#/components/parameters/Codigo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                idDomo: { type: string }
                fechaEntrada: { type: string, format: date }
                fechaSalida: { type: string, format: date }
                ocupantes:
                  type: array
                  description: Lista completa de acompañantes (el titular se conserva)
                  items: { $ref: '#/components/schemas/OcupanteRequest' }
      responses:
        '200': { description: Reserva modificada }
        '422': { $ref: '#/components/responses/ReglaDominio' }

  /reservas/{codigo}/confirmar:
    post:
      tags: [Reservas]
      summary: Confirmar una reserva (PENDIENTE → CONFIRMADA)
      description: >
        Exige hora estimada de llegada (RN-09), anticipo del 50 % pagado en el folio (L-11) y, si el
        domo tiene Jacuzzi, llegada con al menos 3 horas sobre el check-in de las 15:00 (L-21).
      operationId: confirmarReserva
      parameters:
        - $ref: '#/components/parameters/Codigo'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                horaEstimadaLlegada: { type: string, example: "18:30" }
      responses:
        '200': { description: Reserva confirmada }
        '422': { $ref: '#/components/responses/ReglaDominio' }

  /reservas/{codigo}/cancelar:
    post:
      tags: [Reservas]
      summary: Cancelar una reserva (retención según la política congelada, RN-13)
      operationId: cancelarReserva
      parameters:
        - $ref: '#/components/parameters/Codigo'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelarReservaRequest' }
      responses:
        '200': { description: Reserva cancelada y disponibilidad liberada }
        '422': { $ref: '#/components/responses/ReglaDominio' }

  /reservas/{codigo}/check-in:
    post:
      tags: [Reservas]
      summary: Registrar la llegada (CONFIRMADA → EN_CURSO; domo → OCUPADO)
      description: Valida RN-10, RN-11 (domo PREPARADO) y L-22 (depósito registrado en el folio).
      operationId: registrarCheckIn
      parameters:
        - $ref: '#/components/parameters/Codigo'
      responses:
        '200': { description: Check-in exitoso }
        '422': { $ref: '#/components/responses/ReglaDominio' }

  /reservas/{codigo}/check-out:
    post:
      tags: [Reservas]
      summary: Registrar la salida (EN_CURSO → FINALIZADA; domo → PENDIENTE_PREPARACION)
      description: Cierra el folio. Con saldo distinto de cero exige autorización con autor y motivo (RN-17).
      operationId: registrarCheckOut
      parameters:
        - $ref: '#/components/parameters/Codigo'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                autorizadoPor: { type: string }
                motivoAutorizacion: { type: string }
      responses:
        '200': { description: Salida registrada }
        '422': { $ref: '#/components/responses/ReglaDominio' }

  /reservas/{codigo}/no-show:
    post:
      tags: [Reservas]
      summary: Declarar no-show (desde las 20:00 del día de entrada)
      operationId: declararNoShow
      parameters:
        - $ref: '#/components/parameters/Codigo'
      responses:
        '200': { description: Reserva en NO_SHOW }
        '422': { $ref: '#/components/responses/ReglaDominio' }

  /reservas/{codigo}/folio:
    get:
      tags: [Folio]
      summary: Consultar el folio con cargos, pagos y saldo
      operationId: consultarFolio
      parameters:
        - $ref: '#/components/parameters/Codigo'
      responses:
        '200':
          description: Folio
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FolioResponse' }

  /reservas/{codigo}/folio/pagos:
    post:
      tags: [Folio]
      summary: Registrar un pago parcial (RN-15)
      operationId: registrarPago
      parameters:
        - $ref: '#/components/parameters/Codigo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [monto, medio]
              properties:
                monto: { type: integer, example: 500000 }
                medio: { type: string, enum: [TRANSFERENCIA, TARJETA, EFECTIVO] }
                fecha: { type: string, format: date }
      responses:
        '201': { description: Folio actualizado }

  /reservas/{codigo}/folio/servicios:
    post:
      tags: [Folio]
      summary: Registrar un servicio adicional (L-17)
      operationId: registrarServicio
      parameters:
        - $ref: '#/components/parameters/Codigo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [codigoServicio, cantidad]
              properties:
                codigoServicio: { type: string, enum: [KIT_FOGATA, DECORACION_ROMANTICA, CENA_DOMO] }
                cantidad: { type: integer, minimum: 1 }
      responses:
        '201': { description: Folio actualizado }

  /reservas/{codigo}/folio/deposito:
    post:
      tags: [Folio]
      summary: Registrar el depósito exigido para el check-in (L-22)
      operationId: registrarDeposito
      parameters:
        - $ref: '#/components/parameters/Codigo'
      responses:
        '201': { description: Folio actualizado }

  /reservas/{codigo}/folio/deposito/devolucion:
    post:
      tags: [Folio]
      summary: Devolver el depósito (movimiento inverso, RN-16)
      operationId: devolverDeposito
      parameters:
        - $ref: '#/components/parameters/Codigo'
      responses:
        '200': { description: Folio actualizado }

  /canales/externo/disponibilidad:
    get:
      tags: [Canal externo]
      summary: "Operación 1: disponibilidad para un rango y una composición de grupo"
      operationId: disponibilidadCanalExterno
      parameters:
        - $ref: '#/components/parameters/CanalId'
        - $ref: '#/components/parameters/CanalCredencial'
        - { name: fechaEntrada, in: query, required: true, schema: { type: string, format: date } }
        - { name: fechaSalida, in: query, required: true, schema: { type: string, format: date } }
        - { name: fechasNacimiento, in: query, required: true, schema: { type: string }, example: "1990-01-01,1992-05-05" }
      responses:
        '200': { description: Domos disponibles con su cotización }
        '401': { $ref: '#/components/responses/CanalNoAutorizado' }

  /canales/externo/reservas:
    post:
      tags: [Canal externo]
      summary: "Operación 2: crear una reserva externa (RN-18, RN-19)"
      operationId: crearReservaExterna
      parameters:
        - $ref: '#/components/parameters/CanalId'
        - $ref: '#/components/parameters/CanalCredencial'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReservaExternaRequest' }
      responses:
        '201': { description: Reserva externa creada }
        '200': { description: Mensaje repetido; se devuelve la reserva existente sin duplicarla (RN-19) }
        '409': { description: Conflicto de canal; se rechaza y se registra para el administrador (RN-18) }
        '401': { $ref: '#/components/responses/CanalNoAutorizado' }

  /canales/externo/reservas/{idTransaccionExterna}/cancelar:
    post:
      tags: [Canal externo]
      summary: "Operación 3: cancelar una reserva externa"
      operationId: cancelarReservaExterna
      parameters:
        - $ref: '#/components/parameters/CanalId'
        - $ref: '#/components/parameters/CanalCredencial'
        - { name: idTransaccionExterna, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CancelarReservaRequest' }
      responses:
        '200': { description: Reserva cancelada }
        '404': { $ref: '#/components/responses/NoEncontrado' }

  /canales/conflictos:
    get:
      tags: [Canal externo]
      summary: Conflictos de canal registrados (administrador)
      operationId: conflictosDeCanal
      responses:
        '200': { description: Lista de novedades de tipo CONFLICTO_CANAL }

components:
  parameters:
    IdDomo: { name: idDomo, in: path, required: true, schema: { type: string }, example: "DOM-01" }
    Codigo: { name: codigo, in: path, required: true, schema: { type: string }, example: "RES-2026-00001" }
    Pagina: { name: pagina, in: query, required: false, schema: { type: integer, minimum: 0, default: 0 } }
    CanalId: { name: X-Canal-Id, in: header, required: true, schema: { type: string }, example: "BOOKING_COM" }
    CanalCredencial: { name: X-Canal-Credencial, in: header, required: true, schema: { type: string } }

  responses:
    DatosInvalidos:
      description: Datos inválidos o solicitud mal formada
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorRespuesta' } } }
    NoEncontrado:
      description: Recurso no encontrado
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorRespuesta' } } }
    ReglaDominio:
      description: Regla de negocio violada
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorRespuesta' } } }
    CanalNoAutorizado:
      description: Canal no registrado o credencial inválida
      content: { application/json: { schema: { $ref: '#/components/schemas/ErrorRespuesta' } } }

  schemas:
    OcupanteRequest:
      type: object
      required: [documento, nombre, fechaNacimiento]
      properties:
        documento: { type: string, example: "1094888777" }
        nombre: { type: string, example: "Luis Ramírez" }
        fechaNacimiento: { type: string, format: date, example: "1995-05-15" }

    TitularRequest:
      type: object
      required: [documento, nombre, fechaNacimiento, correo, telefono]
      properties:
        documento: { type: string, example: "1094123456" }
        nombre: { type: string, example: "Ana Ramírez" }
        fechaNacimiento: { type: string, format: date, example: "1990-05-12" }
        correo: { type: string, format: email, example: "ana@correo.com" }
        telefono: { type: string, example: "3001234567" }

    CrearReservaRequest:
      type: object
      required: [idDomo, fechaEntrada, fechaSalida, canalOrigen, titular]
      properties:
        idDomo: { type: string, example: "DOM-03" }
        fechaEntrada: { type: string, format: date, example: "2026-11-20" }
        fechaSalida: { type: string, format: date, example: "2026-11-22" }
        canalOrigen: { type: string, enum: [PORTAL, DIRECTO] }
        horaEstimadaLlegada: { type: string, example: "18:30" }
        titular: { $ref: '#/components/schemas/TitularRequest' }
        ocupantes:
          type: array
          description: Acompañantes; el titular se agrega solo como ocupante
          items: { $ref: '#/components/schemas/OcupanteRequest' }

    CancelarReservaRequest:
      type: object
      required: [motivo]
      properties:
        motivo: { type: string, minLength: 5, maxLength: 300 }

    CotizarEstanciaRequest:
      type: object
      required: [fechaEntrada, fechaSalida, fechasNacimiento]
      properties:
        fechaEntrada: { type: string, format: date }
        fechaSalida: { type: string, format: date }
        fechasNacimiento: { type: array, items: { type: string, format: date } }

    ReservaExternaRequest:
      type: object
      required: [idTransaccionExterna, idDomo, fechaEntrada, fechaSalida, titular]
      properties:
        idTransaccionExterna: { type: string, example: "EXT-998877" }
        idDomo: { type: string, example: "DOM-01" }
        fechaEntrada: { type: string, format: date }
        fechaSalida: { type: string, format: date }
        horaEstimadaLlegada: { type: string, example: "19:00" }
        titular: { $ref: '#/components/schemas/TitularRequest' }
        ocupantes: { type: array, items: { $ref: '#/components/schemas/OcupanteRequest' } }

    DetalleNoche:
      type: object
      properties:
        fecha: { type: string, format: date }
        temporada: { type: string, example: "Base" }
        tarifaPorOcupanteFacturable: { type: integer, example: 250000 }
        ocupantesFacturables: { type: integer, example: 2 }
        recargoPersonaAdicional: { type: integer, example: 62500 }
        subtotal: { type: integer, example: 562500 }

    CotizacionDomoResponse:
      type: object
      properties:
        idDomo: { type: string, example: "DOM-03" }
        nombre: { type: string, example: "Domo Familiar" }
        capacidadMaxima: { type: integer, example: 4 }
        tieneJacuzzi: { type: boolean }
        caracteristicas: { type: array, items: { type: string } }
        noches: { type: integer }
        recargoOcupanteAdicional: { type: integer, example: 125000 }
        valorTotalEstancia: { type: integer, example: 1125000 }
        moneda: { type: string, example: "COP" }
        desglose: { type: array, items: { $ref: '#/components/schemas/DetalleNoche' } }

    PaginaCotizaciones:
      type: object
      properties:
        contenido: { type: array, items: { $ref: '#/components/schemas/CotizacionDomoResponse' } }
        pagina: { type: integer }
        tamano: { type: integer, example: 10 }
        totalElementos: { type: integer }
        totalPaginas: { type: integer }

    DomoResponse:
      type: object
      properties:
        idDomo: { type: string }
        nombre: { type: string }
        dormitorios: { type: integer }
        capacidadMaxima: { type: integer }
        caracteristicas: { type: array, items: { type: string } }
        tieneJacuzzi: { type: boolean }
        estadoOperativo: { type: string, enum: [PREPARADO, OCUPADO, PENDIENTE_PREPARACION, EN_PREPARACION, FUERA_DE_SERVICIO] }
        activo: { type: boolean }
        tarifasPorTemporada: { type: object, additionalProperties: { type: integer } }

    ReservaDetalleResponse:
      type: object
      properties:
        codigo: { type: string, example: "RES-2026-00001" }
        estado: { type: string, enum: [PENDIENTE, CONFIRMADA, EN_CURSO, FINALIZADA, CANCELADA, NO_SHOW] }
        canalOrigen: { type: string, enum: [PORTAL, DIRECTO, EXTERNO] }
        idDomo: { type: string }
        fechaEntrada: { type: string, format: date }
        fechaSalida: { type: string, format: date }
        noches: { type: integer }
        horaEstimadaLlegada: { type: string }
        valorTotal: { type: integer }
        moneda: { type: string }
        desglose: { type: array, items: { $ref: '#/components/schemas/DetalleNoche' } }
        versionPoliticaCancelacion: { type: integer }

    FolioResponse:
      type: object
      properties:
        codigoFolio: { type: string }
        codigoReserva: { type: string }
        cargos:
          type: array
          items:
            type: object
            properties:
              concepto: { type: string, enum: [ALOJAMIENTO, SERVICIO, PENALIDAD, AJUSTE, DEPOSITO] }
              valor: { type: integer }
              esInverso: { type: boolean }
              fecha: { type: string, format: date }
              descripcion: { type: string }
        pagos:
          type: array
          items:
            type: object
            properties:
              idPago: { type: string }
              monto: { type: integer }
              medio: { type: string }
              fecha: { type: string, format: date }
        totalCargos: { type: integer }
        totalPagos: { type: integer }
        saldo: { type: integer, description: "Positivo: debe el huésped. Negativo: saldo a favor." }
        depositoRegistrado: { type: boolean }
        cerrado: { type: boolean }

    ErrorRespuesta:
      type: object
      properties:
        codigoError: { type: string, example: "REGLA_DOMINIO_VIOLADA" }
        mensaje: { type: string, example: "L-22: el folio no registra el depósito; no se autoriza el ingreso." }
        detalles: { type: array, items: { type: string } }
