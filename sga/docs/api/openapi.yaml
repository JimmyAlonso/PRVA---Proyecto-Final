components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Pagina:
      name: pagina
      in: query
      required: false
      description: Página base 0 (10 resultados por página)
      schema:
        type: integer
        default: 0
        minimum: 0
    IdDomo:
      name: idDomo
      in: path
      required: true
      schema:
        type: string
      example: DOM-01
    Codigo:
      name: codigo
      in: path
      required: true
      schema:
        type: string
      example: RES-2026-00001
    IdTemporada:
      name: idTemporada
      in: path
      required: true
      schema:
        type: string
      example: ALTA
    IdUsuario:
      name: idUsuario
      in: path
      required: true
      schema:
        type: string
    CanalId:
      name: X-Canal-Id
      in: header
      required: true
      schema:
        type: string
      example: BOOKING_COM
    CanalCredencial:
      name: X-Canal-Credencial
      in: header
      required: true
      schema:
        type: string
  responses:
    DatosInvalidos:
      description: Forma del mensaje inválida (Bean Validation, JSON o parámetros)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NoAutenticado:
      description: Sin token válido, credenciales incorrectas o canal sin credencial
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    AccesoDenegado:
      description: El rol o el propietario del recurso no permiten la operación
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NoEncontrado:
      description: El recurso no existe
      content:
