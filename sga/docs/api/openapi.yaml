openapi: 3.1.0
info:
  title: SGA - JiyJu Glamping API
  version: 2.0.0
  description: 'API del Sistema de Gestión de Alojamiento (SGA) de JiyJu Glamping (Salento, Quindío), alojamiento de domos.
    Corte 2: usuarios y seguridad (7.2), alojamiento y domos (7.3), temporadas, tarifas y política (7.4), disponibilidad y
    reservas (7.5); incluye además folio, operación diaria y canal externo. Valores en COP sin decimales. Todos los listados
    se paginan de 10 en 10 (parámetro pagina, base 0).


    Seguridad: JWT en "Authorization: Bearer {token}" (POST /auth/login). El canal externo usa las cabeceras X-Canal-Id y
    X-Canal-Credencial.


    Errores (esquema ErrorResponse): 400 forma del mensaje, 401 no autenticado, 403 rol o propietario sin permiso, 404 recurso
    inexistente, 409 regla de negocio violada.'
servers:
- url: http://localhost:8080/api/v1
  description: Servidor local de desarrollo
security:
- bearerAuth: []
tags:
- name: Autenticación
- name: Usuarios
- name: Alojamiento
- name: Temporadas
- name: Política de cancelación
- name: Domos
- name: Operación diaria
- name: Reservas
- name: Folio
- name: Canal externo
paths:
  /auth/registro:
    post:
      tags:
      - Autenticación
      summary: Registro público de huéspedes (7.2)
      operationId: registrarHuesped
      description: 'Crea un usuario con rol HUESPED. 409 si el correo ya está registrado. Acceso: público.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistroHuespedRequest'
      responses:
        '201':
          description: Huésped registrado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
          headers:
            Location:
              description: URI del recurso creado
              schema:
                type: string
        '400': &id001
          $ref: '#/components/responses/DatosInvalidos'
        '409': &id002
          $ref: '#/components/responses/ReglaDeNegocio'
  /auth/login:
    post:
      tags:
      - Autenticación
      summary: Iniciar sesión y obtener el JWT (7.2)
      operationId: iniciarSesion
      description: 'Acceso: público.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Token emitido con su expiración
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '400': *id001
        '401': &id003
          $ref: '#/components/responses/NoAutenticado'
  /auth/recuperacion:
    post:
      tags:
      - Autenticación
      summary: Solicitar código de recuperación de contraseña (7.2)
      operationId: solicitarRecuperacion
      description: 'Envía al correo registrado un código de 6 dígitos, válido 15 minutos y de un solo uso. Acceso: público.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitarRecuperacionRequest'
      responses:
        '200':
          description: Mensaje genérico (no revela si el correo existe)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
        '400': *id001
  /auth/recuperacion/restablecer:
    post:
      tags:
      - Autenticación
      summary: Restablecer la contraseña con el código (7.2)
      operationId: restablecerContrasena
      description: 'Acceso: público.'
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RestablecerContrasenaRequest'
      responses:
        '200':
          description: Contraseña restablecida
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
        '400': *id001
        '409': *id002
  /usuarios/me:
    get:
      tags:
      - Usuarios
      summary: Consultar mi perfil
      operationId: miPerfil
      description: 'Acceso: cualquier usuario autenticado.'
      responses:
        '200':
          description: Perfil
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '401': *id003
    put:
      tags:
      - Usuarios
      summary: Actualizar nombre, teléfono y foto (el correo no es editable)
      operationId: actualizarPerfil
      description: 'Acceso: cualquier usuario autenticado.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarPerfilRequest'
      responses:
        '200':
          description: Perfil actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400': *id001
        '401': *id003
  /usuarios/me/contrasena:
    put:
      tags:
      - Usuarios
      summary: Cambiar mi contraseña con la actual y la nueva
      operationId: cambiarContrasena
      description: 'Acceso: cualquier usuario autenticado.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CambiarContrasenaRequest'
      responses:
        '200':
          description: Contraseña cambiada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
        '400': *id001
        '401': *id003
        '409': *id002
  /usuarios:
    get:
      tags:
      - Usuarios
      summary: Listar usuarios activos (10 por página)
      operationId: listarUsuarios
      description: 'Acceso: ADMINISTRADOR.'
      parameters:
      - $ref: '#/components/parameters/Pagina'
      responses:
        '200':
          description: Página de usuarios
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaUsuarios'
        '401': *id003
        '403': &id004
          $ref: '#/components/responses/AccesoDenegado'
    post:
      tags:
      - Usuarios
      summary: Crear un usuario con su rol (7.1)
      operationId: crearUsuario
      description: 'Acceso: ADMINISTRADOR.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CrearUsuarioRequest'
      responses:
        '201':
          description: Usuario creado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
          headers:
            Location:
              description: URI del recurso creado
              schema:
                type: string
        '400': *id001
        '401': *id003
        '403': *id004
        '409': *id002
  /usuarios/{idUsuario}:
    get:
      tags:
      - Usuarios
      summary: Consultar un usuario
      operationId: obtenerUsuario
      description: 'Acceso: ADMINISTRADOR.'
      parameters:
      - $ref: '#/components/parameters/IdUsuario'
      responses:
        '200':
          description: Usuario
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '401': *id003
        '403': *id004
        '404': &id005
          $ref: '#/components/responses/NoEncontrado'
    delete:
      tags:
      - Usuarios
      summary: Eliminar un usuario (eliminación lógica)
      operationId: eliminarUsuario
      description: 'No borra el registro: lo marca como eliminado. 409 si es titular de reservas PENDIENTE, CONFIRMADA o EN_CURSO.
        Acceso: ADMINISTRADOR.'
      parameters:
      - $ref: '#/components/parameters/IdUsuario'
      responses:
        '200':
          description: Usuario eliminado lógicamente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MensajeResponse'
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id002
  /usuarios/{idUsuario}/rol:
    put:
      tags:
      - Usuarios
      summary: 'Asignar rol (7.2: los roles internos los asigna el administrador)'
      operationId: asignarRol
      description: 'Acceso: ADMINISTRADOR.'
      parameters:
      - $ref: '#/components/parameters/IdUsuario'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AsignarRolRequest'
      responses:
        '200':
          description: Usuario con su nuevo rol
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UsuarioResponse'
        '400': *id001
        '401': *id003
        '403': *id004
        '404': *id005
  /alojamiento:
    get:
      tags:
      - Alojamiento
      summary: Datos del alojamiento, horarios, normas, servicios y parámetros (7.3)
      operationId: consultarAlojamiento
      description: 'Acceso: público.'
      security: []
      responses:
        '200':
          description: Alojamiento
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlojamientoResponse'
    put:
      tags:
      - Alojamiento
      summary: Actualizar descripción, dirección, ubicación y normas (7.3)
      operationId: actualizarAlojamiento
      description: 'Los parámetros de la sección 6 son configuración (application.properties) y no se editan por la API. Acceso:
        ADMINISTRADOR.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarAlojamientoRequest'
      responses:
        '200':
          description: Alojamiento actualizado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlojamientoResponse'
        '400': *id001
        '401': *id003
        '403': *id004
        '409': *id002
  /alojamiento/servicios/{codigo}:
    put:
      tags:
      - Alojamiento
      summary: Definir o reemplazar un servicio adicional (L-17)
      operationId: definirServicio
      description: 'Acceso: ADMINISTRADOR.'
      parameters:
      - name: codigo
        in: path
        required: true
        schema:
          type: string
        example: KIT_FOGATA
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ServicioAdicionalRequest'
      responses:
        '200':
          description: Alojamiento con el servicio
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlojamientoResponse'
        '400': *id001
        '401': *id003
        '403': *id004
        '409': *id002
  /temporadas:
    get:
      tags:
      - Temporadas
      summary: Listar temporadas (10 por página)
      operationId: listarTemporadas
      description: 'Acceso: público.'
      security: []
      parameters:
      - $ref: '#/components/parameters/Pagina'
      responses:
        '200':
          description: Página de temporadas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaTemporadas'
    post:
      tags:
      - Temporadas
      summary: Registrar una temporada con la tarifa de cada domo activo (7.4)
      operationId: registrarTemporada
      description: '409 si se solapa con otra temporada, si el identificador ya existe o si algún domo activo queda sin tarifa.
        Acceso: ADMINISTRADOR.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarTemporadaRequest'
      responses:
        '201':
          description: Temporada creada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporadaResponse'
          headers:
            Location:
              description: URI del recurso creado
              schema:
                type: string
        '400': *id001
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id002
  /temporadas/{idTemporada}:
    get:
      tags:
      - Temporadas
      summary: Consultar una temporada
      operationId: obtenerTemporada
      description: 'Acceso: público.'
      security: []
      parameters:
      - $ref: '#/components/parameters/IdTemporada'
      responses:
        '200':
          description: Temporada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporadaResponse'
        '404': *id005
    put:
      tags:
      - Temporadas
      summary: Cambiar el nombre o los rangos de una temporada
      operationId: redefinirTemporada
      description: 'Acceso: ADMINISTRADOR.'
      parameters:
      - $ref: '#/components/parameters/IdTemporada'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RedefinirTemporadaRequest'
      responses:
        '200':
          description: Temporada actualizada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TemporadaResponse'
        '400': *id001
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id002
  /politica-cancelacion/vigente:
    get:
      tags:
      - Política de cancelación
      summary: Política vigente hoy (F-07)
      operationId: politicaVigente
      description: 'Acceso: público.'
      security: []
      responses:
        '200':
          description: Versión vigente
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoliticaCancelacionResponse'
        '404': *id005
  /politica-cancelacion/versiones:
    get:
      tags:
      - Política de cancelación
      summary: Historial de versiones (10 por página)
      operationId: versionesPolitica
      description: 'Acceso: ADMINISTRADOR.'
      parameters:
      - $ref: '#/components/parameters/Pagina'
      responses:
        '200':
          description: Página de versiones
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaPoliticas'
        '401': *id003
        '403': *id004
    post:
      tags:
      - Política de cancelación
      summary: Publicar una nueva versión; la anterior se conserva
      operationId: publicarPolitica
      description: 'Acceso: ADMINISTRADOR.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublicarPoliticaRequest'
      responses:
        '201':
          description: Versión publicada
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoliticaCancelacionResponse'
          headers:
            Location:
              description: URI del recurso creado
              schema:
                type: string
        '400': *id001
        '401': *id003
        '403': *id004
        '409': *id002
  /politica-cancelacion/versiones/{numero}:
    get:
      tags:
      - Política de cancelación
      summary: Consultar una versión
      operationId: versionPolitica
      description: 'Acceso: ADMINISTRADOR.'
      parameters:
      - name: numero
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: Versión
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PoliticaCancelacionResponse'
        '401': *id003
        '403': *id004
        '404': *id005
  /domos:
    get:
      tags:
      - Domos
      summary: Listar domos activos (10 por página)
      operationId: listarDomos
      description: 'Acceso: público.'
      security: []
      parameters:
      - $ref: '#/components/parameters/Pagina'
      responses:
        '200':
          description: Página de domos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDomos'
    post:
      tags:
      - Domos
      summary: Registrar un domo con sus tarifas (7.3)
      operationId: registrarDomo
      description: 'Acceso: ADMINISTRADOR.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegistrarDomoRequest'
      responses:
        '201':
          description: Domo creado (activo solo si tiene tarifa en todas las temporadas)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomoResponse'
          headers:
            Location:
              description: URI del recurso creado
              schema:
                type: string
        '400': *id001
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id002
  /domos/inventario:
    get:
      tags:
      - Domos
      summary: Inventario completo, activos e inactivos (10 por página)
      operationId: inventarioDomos
      description: 'Acceso: ADMINISTRADOR.'
      parameters:
      - $ref: '#/components/parameters/Pagina'
      responses:
        '200':
          description: Página de domos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDomos'
        '401': *id003
        '403': *id004
  /domos/disponibles:
    get:
      tags:
      - Domos
      summary: Buscar domos disponibles por fechas y composición del grupo (7.5)
      operationId: buscarDisponibles
      description: 'Acceso: público.'
      security: []
      parameters:
      - name: fechaEntrada
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: fechaSalida
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: fechasNacimiento
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: date
        description: Fechas de nacimiento del grupo separadas por coma
        style: form
        explode: false
      - name: numeroOcupantes
        in: query
        required: false
        schema:
          type: integer
        description: 'Alternativa a fechasNacimiento: todos adultos'
      - name: capacidadMinima
        in: query
        required: false
        schema:
          type: integer
      - name: precioMaximo
        in: query
        required: false
        schema:
          type: integer
        description: Valor total máximo de la estancia (COP)
      - name: caracteristica
        in: query
        required: false
        schema:
          type: string
      - name: conJacuzzi
        in: query
        required: false
        schema:
          type: boolean
      - $ref: '#/components/parameters/Pagina'
      responses:
        '200':
          description: Página de domos disponibles con su valor estimado
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaCotizaciones'
        '400': *id001
        '409': *id002
  /domos/pendientes-preparacion:
    get:
      tags:
      - Operación diaria
      summary: Domos pendientes o en preparación (10 por página)
      operationId: pendientesPreparacion
      description: 'Acceso: PERSONAL_SERVICIO, ADMINISTRADOR.'
      parameters:
      - $ref: '#/components/parameters/Pagina'
      responses:
        '200':
          description: Página de domos
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginaDomos'
        '401': *id003
        '403': *id004
  /domos/{idDomo}:
    get:
      tags:
      - Domos
      summary: Detalle del domo con dotación, estado operativo y tarifas
      operationId: obtenerDomo
      description: 'Acceso: público.'
      security: []
      parameters:
      - $ref: '#/components/parameters/IdDomo'
      responses:
        '200':
          description: Domo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomoResponse'
        '404': *id005
    put:
      tags:
      - Domos
      summary: Actualizar datos y dotación (7.3)
      operationId: actualizarDomo
      description: 'Acceso: ADMINISTRADOR.'
      parameters:
      - $ref: '#/components/parameters/IdDomo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ActualizarDomoRequest'
      responses:
        '200':
          description: Domo actualizado; advierte las reservas por encima de la nueva capacidad
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomoActualizadoResponse'
        '400': *id001
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id002
  /domos/{idDomo}/cotizacion:
    post:
      tags:
      - Domos
      summary: Cotizar una estancia con desglose noche por noche (7.4)
      operationId: cotizarEstancia
      description: 'Acceso: público.'
      security: []
      parameters:
      - $ref: '#/components/parameters/IdDomo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CotizarEstanciaRequest'
      responses:
        '200':
          description: Cotización
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CotizacionDomoResponse'
        '400': *id001
        '404': *id005
        '409': *id002
  /domos/{idDomo}/calendario:
    get:
      tags:
      - Domos
      summary: Calendario de ocupación por rango de fechas (7.5)
      operationId: calendarioOcupacion
      description: 'Acceso: público.'
      security: []
      parameters:
      - $ref: '#/components/parameters/IdDomo'
      - name: desde
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: hasta
        in: query
        required: true
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Noches LIBRE, RESERVADA o BLOQUEADA
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/NocheCalendarioResponse'
        '400': *id001
        '404': *id005
        '409': *id002
  /domos/{idDomo}/tarifas:
    put:
      tags:
      - Domos
      summary: Definir o cambiar tarifas; el valor anterior pasa al histórico (7.4)
      operationId: establecerTarifas
      description: 'Acceso: ADMINISTRADOR.'
      parameters:
      - $ref: '#/components/parameters/IdDomo'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EstablecerTarifasRequest'
      responses:
        '200':
          description: Domo con sus tarifas
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomoResponse'
        '400': *id001
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id002
  /domos/{idDomo}/tarifas/historial:
    get:
      tags:
      - Domos
      summary: Histórico de tarifas del domo (7.4)
      operationId: historialTarifas
      description: 'Acceso: ADMINISTRADOR.'
      parameters:
      - $ref: '#/components/parameters/IdDomo'
      responses:
        '200':
          description: Tarifas reemplazadas
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/RegistroTarifaResponse'
        '401': *id003
        '403': *id004
        '404': *id005
  /domos/{idDomo}/activar:
    post:
      tags:
      - Domos
      summary: Activar el domo (exige tarifas completas, 7.4)
      operationId: activarDomo
      description: 'Acceso: ADMINISTRADOR.'
      parameters:
      - $ref: '#/components/parameters/IdDomo'
      responses:
        '200':
          description: Domo
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DomoResponse'
        '401': *id003
        '403': *id004
        '404': *id005
        '409': *id002
